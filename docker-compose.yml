services:
  postgres:
    image: postgres:17-alpine
    container_name: alifco-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: alifco_auth
      POSTGRES_PASSWORD: alifco_auth
      POSTGRES_DB: alifco_auth
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alifco_auth"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
